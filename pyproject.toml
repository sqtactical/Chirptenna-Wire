[project]
name = "chirptenna-wire"
version = "0.1.0a0"
description = "Planos de antenas de alambre, varilla y coaxial con simulación NEC2"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["antenna", "nec2", "ham radio", "dipole", "j-pole"]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Communications :: Ham Radio"]
requires-python = ">=3.11"
# fpdf2 (con fonttools y Pillow) es lo único que necesitan los planos; también carga en Pyodide con micropip.
dependencies = ["fpdf2>=2.8"]

[project.urls]
Repository = "https://github.com/sqtactical/Chirptenna-Wire"
Familia = "https://github.com/sqtactical/chirptenna"

[project.optional-dependencies]
motor = ["PyNEC>=2.4", "numpy"]
escritorio = ["nicegui"]
web = ["playwright"]
pruebas = ["pytest"]

[tool.setuptools]
packages = ["wire", "wire.planos"]
# `gui/` (interfaz de escritorio) se ejecuta desde el repositorio: python gui/app.py

[tool.setuptools.package-data]
"wire.planos" = ["recursos/*"]
"wire" = ["idiomas/*.json"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
