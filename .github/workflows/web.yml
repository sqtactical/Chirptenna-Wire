name: web

# Publica la web lite en GitHub Pages. Solo a mano: gh workflow run web.yml --ref main
# (Antes hay que activar Pages: Settings → Pages → Source: GitHub Actions.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python herramientas/construir_web.py salidas/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: salidas/web
      - id: despliegue
        uses: actions/deploy-pages@v4
